service:
  grpc_transport: {enabled: true}
  name: infra_config
  version: 0.1.0
  description: "Configuration Service - provides feature flags and configuration to services"

  # Enable service in project generation
  active: true

  # Python version
  python:
    major: 3
    minor: 12

  # User main.py
  main:
    enabled: false

  # gRPC server
  grpc:
    enabled: true
    port: 10011

  # gRPC client (call other services)
  grpc_client:
    enabled: false
    services: []

  # Kafka
  kafka_producer:
    enabled: false
    topics: []

  kafka_consumer:
    enabled: false
    topics: []
    group_id: null
    auto_offset_reset: "earliest"
    max_poll_records: 100
    max_poll_interval_ms: 300000

  # Infrastructure
  postgres:
    enabled: true
    pool_size: 10
    pool_max_overflow: 5
    pool_mode: "transaction"
    migration_dir: "migrations"

  minio:
    enabled: false
    buckets: []

  vault:
    enabled: true
    vars:
      - INFRA_CONFIG_DB_URL

  scheduler:
    enabled: true
    storage: "memory"

  logging:
    file:
        level: INFO
        path: logs/app.log
        max_bytes: 10485760  # 10MB
        backup_count: 5
    loki:
        enabled: true
        level: INFO
        batch_size: 100
        flush_interval: 5
        max_retries: 3
        timeout: 10

  # Observability
  observability:
    enabled: true
    log_level: INFO
    trace_sampling_rate: 1.0
    metrics_enabled: true
    service_name: null

  # Config service specific
  config:
    enabled: false
