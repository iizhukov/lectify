service:
  grpc_transport: {enabled: true}
  name: api_workflow
  version: 0.1.0
  description: Owned workflow and node templates with immutable execution snapshots
  active: true
  grpc:
    enabled: true
    port: 10024
  postgres:
    enabled: true
    migration_dir: migrations
  vault:
    enabled: true
    vars:
      - API_WORKFLOW_DB_URL
  user_auth:
    auth_service: api_auth
    enabled: true
  testing:
    generated_fixtures: false
  workflow_validation:
    enabled: true
  observability:
    enabled: true
