syntax = "proto3";
package plugins.provider.v1;
service ProviderService {
  rpc CallLLM(LLMRequest) returns (stream LLMResponse);
  rpc Transcribe(stream AudioFrame) returns (TranscribeResponse);
}
message LLMMessage { string role = 1; string content = 2; }
message LLMRequest {
  string model = 1;
  repeated LLMMessage messages = 2;
  float temperature = 3;
  int32 max_tokens = 4;
  string purpose = 5;
  map<string,string> extra_params = 6;
  string owner_id = 7;
  string execution_id = 8;
  string node_id = 9;
}
message LLMResponse {
  string delta_content = 1;
  bool is_finished = 2;
  string finish_reason = 3;
  int32 tokens_used = 4;
  int64 latency_ms = 5;
}
message AudioMetadata {
  string model = 1;
  string language = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string owner_id = 5;
  string execution_id = 6;
  string node_id = 7;
}
message AudioFrame { oneof data { AudioMetadata metadata = 1; bytes chunk = 2; } int64 sequence = 3; bool is_last = 4; }
message TranscribeResponse { string text = 1; string language = 2; double duration = 3; }
