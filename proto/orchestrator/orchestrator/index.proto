syntax = "proto3";

package orchestrator.v1;

service OrchestratorService {
    // Workflow Execution Management
    rpc StartExecution(StartExecutionRequest) returns (StartExecutionResponse);
    rpc RestartExecution(RestartExecutionRequest) returns (StartExecutionResponse);
    rpc GetExecutionDetails(GetExecutionStatusRequest) returns (ExecutionDetails);
    rpc GetNodeDetails(NodeDetailsRequest) returns (NodeDetails);
    rpc GetNodeLogs(NodeLogsRequest) returns (NodeLogsResponse);
    rpc DownloadNodeLog(NodeLogRequest) returns (stream NodeLogChunk);
    rpc CancelExecution(CancelExecutionRequest) returns (CancelExecutionResponse);
    rpc GetExecutionStatus(GetExecutionStatusRequest) returns (GetExecutionStatusResponse);
    rpc ListExecutions(ListExecutionsRequest) returns (ListExecutionsResponse);
    rpc StreamExecutionEvents(StreamExecutionEventsRequest) returns (stream ExecutionEvent);

    // Node & Stream Control
    rpc PauseExecution(PauseExecutionRequest) returns (PauseExecutionResponse);
    rpc ResumeExecution(ResumeExecutionRequest) returns (ResumeExecutionResponse);
    rpc RetryNode(RetryNodeRequest) returns (RetryNodeResponse);

    // Execution-scoped agent reports, persisted before acknowledgement.
    rpc ReportNodeEvent(ReportNodeEventRequest) returns (ReportNodeEventResponse);

    // Plugin Registry within Orchestrator
    rpc RegisterPluginManifest(RegisterPluginManifestRequest) returns (RegisterPluginManifestResponse);
    rpc ListRegisteredPlugins(ListRegisteredPluginsRequest) returns (ListRegisteredPluginsResponse);
    rpc GetPluginManifest(GetPluginManifestRequest) returns (GetPluginManifestResponse);
}

message GetPluginManifestRequest { string plugin_id = 1; string version = 2; }
message GetPluginManifestResponse { string manifest_json = 1; }
message ListExecutionsRequest { int32 page_size = 1; int32 offset = 2; }
message ExecutionSummary {
    string execution_id = 1; string workflow_id = 2; string state = 3;
    int32 total_progress_percent = 4; int64 started_at = 5; int64 finished_at = 6;
  string parent_execution_id = 7;
}
message ListExecutionsResponse { repeated ExecutionSummary executions = 1; bool has_more = 2; }

enum ExecutionState {
    EXECUTION_STATE_UNSPECIFIED = 0;
    EXECUTION_STATE_PENDING = 1;
    EXECUTION_STATE_PROVISIONING = 2;
    EXECUTION_STATE_RUNNING = 3;
    EXECUTION_STATE_PAUSED = 4;
    EXECUTION_STATE_COMPLETED = 5;
    EXECUTION_STATE_FAILED = 6;
    EXECUTION_STATE_CANCELLED = 7;
}

enum NodeState {
    NODE_STATE_UNSPECIFIED = 0;
    NODE_STATE_PENDING = 1;
    NODE_STATE_PROVISIONING = 2;
    NODE_STATE_BUFFERING = 3;
    NODE_STATE_PROCESSING = 4;
    NODE_STATE_COMPLETED = 5;
    NODE_STATE_FAILED = 6;
    NODE_STATE_CANCELLED = 7;
    NODE_STATE_SKIPPED = 8;
}

message WorkflowNode {
    string id = 1;
    string plugin_id = 2;
    string plugin_version = 3;
    map<string, string> parameters = 4;
    map<string, string> input_bindings = 5; // e.g. "audio_chunk" -> "source_node_id.output_stream"
    string parameters_json = 6; // Preferred typed JSON object; mutually exclusive with parameters.
    string input_mapping_json = 7; // Frozen workflow input mapping objects.
    string prompt_id = 8;
    string name = 9; string description = 10;
}

message WorkflowEdge {
    string from_node_id = 1;
    string from_output = 2;
    string to_node_id = 3;
    string to_input = 4;
}

message WorkflowGraph {
    repeated WorkflowNode nodes = 1;
    repeated WorkflowEdge edges = 2;
}

message StartExecutionRequest {
    string workflow_id = 1;
    string execution_id = 2; // optional, generated if empty
    WorkflowGraph graph = 3;
    map<string, string> initial_inputs = 4; // e.g. "file_id", "media_url", "text"
    string user_id = 5;
}

message StartExecutionResponse {
    string workflow_id = 4; string parent_execution_id = 5;
    string execution_id = 1;
    ExecutionState state = 2;
    int64 started_at = 3;
}

message CancelExecutionRequest {
    string execution_id = 1;
    string reason = 2;
}

message CancelExecutionResponse {
    bool success = 1;
    ExecutionState state = 2;
}

message GetExecutionStatusRequest {
    string execution_id = 1;
}

message NodeExecutionStatus {
    string node_id = 1;
    string plugin_id = 2;
    NodeState state = 3;
    int32 progress_percent = 4;
    string progress_message = 5;
    int64 bytes_streamed_in = 6;
    int64 bytes_streamed_out = 7;
    int32 chunks_processed = 8;
    int64 execution_time_ms = 9;
    string error_message = 10;
    map<string, string> output_artifacts = 11;
}

message GetExecutionStatusResponse {
    string execution_id = 1;
    ExecutionState state = 2;
    int32 total_progress_percent = 3;
    repeated NodeExecutionStatus nodes = 4;
    int64 started_at = 5;
    int64 finished_at = 6;
    string error_message = 7;
}

message StreamExecutionEventsRequest {
    string execution_id = 1;
    int64 after_sequence = 2;
}

enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    EVENT_TYPE_STATE_CHANGED = 1;
    EVENT_TYPE_NODE_PROGRESS = 2;
    EVENT_TYPE_CHUNK_STREAMED = 3;
    EVENT_TYPE_BUFFER_TRIGGERED = 4;
    EVENT_TYPE_NODE_COMPLETED = 5;
    EVENT_TYPE_NODE_FAILED = 6;
    EVENT_TYPE_ARTIFACT_SAVED = 7;
    EVENT_TYPE_LOG_EMITTED = 8;
    EVENT_TYPE_METRICS_REPORTED = 9;
}

message ExecutionEvent {
    string execution_id = 1;
    string node_id = 2;
    EventType event_type = 3;
    int64 timestamp = 4;
    string message = 5;
    int32 progress_percent = 6;
    map<string, string> metadata = 7;
    int64 sequence = 8; // Durable node report cursor; state snapshots use zero.
}

message PauseExecutionRequest {
    string execution_id = 1;
}

message PauseExecutionResponse {
    bool success = 1;
    ExecutionState state = 2;
}

message ResumeExecutionRequest {
    string execution_id = 1;
}

message ResumeExecutionResponse {
    bool success = 1;
    ExecutionState state = 2;
}

message RetryNodeRequest {
    string execution_id = 1;
    string node_id = 2;
}

message RetryNodeResponse {
    bool success = 1;
    NodeState state = 2;
}

message RegisterPluginManifestRequest {
    string plugin_id = 1;
    string version = 2;
    string manifest_yaml = 3;
}

message RegisterPluginManifestResponse {
    bool success = 1;
    string message = 2;
}

message ListRegisteredPluginsRequest {
    string category = 1;
}

message PluginSummary {
    string plugin_id = 1;
    string name = 2;
    string version = 3;
    string category = 4;
    string description = 5;
    repeated string supported_inputs = 6;
    repeated string supported_outputs = 7;
}

message ListRegisteredPluginsResponse {
    repeated PluginSummary plugins = 1;
}

message ReportNodeEventRequest {
    string execution_id = 1;
    string node_id = 2;
    string owner = 3; // Dispatch worker owner, not an end-user claim.
    int64 fence = 4;
    string event_id = 5;
    string kind = 6; // progress, log, metrics, artifact
    string payload_json = 7;
    string report_token = 8;
}
message ReportNodeEventResponse {
    bool accepted = 1;
    string event_id = 2;
    int64 sequence = 3;
}

// Restarts a terminal execution as a new linked execution with the original frozen graph and inputs.
message RestartExecutionRequest { string execution_id = 1; string request_key = 2; }
message NodeDetailsRequest { string execution_id = 1; string node_id = 2; int32 page_size = 3; int32 offset = 4; }
message ArtifactInfo { string name = 1; string file_id = 2; int64 size_bytes = 3; }
message NodeAttempt {
    string id = 1; int32 number = 2; int64 fence = 3; string state = 4;
    int64 started_at = 5; int64 finished_at = 6; string error_message = 7;
    int64 bytes_streamed_in = 8; int64 bytes_streamed_out = 9; int64 chunks_processed = 10;
    int64 execution_time_ms = 11; repeated ArtifactInfo artifacts = 12;
    string container_id = 13; string worker_id = 14; string image = 15;
    int64 log_bytes = 16; bool logs_truncated = 17;
}
message NodeDetails {
    string node_id = 1; string plugin_id = 2; string plugin_version = 3; string state = 4;
    string parameters_json = 5; string input_mapping_json = 6;
    repeated WorkflowEdge incoming_edges = 7; repeated NodeAttempt attempts = 8;
    bool has_more_attempts = 9; bool checkpoint_ready = 10;
    string name = 11; string description = 12;
}
message ExecutionDetails {
    GetExecutionStatusResponse status = 1; string workflow_id = 2; string parent_execution_id = 3;
    string graph_json = 4; map<string,string> initial_inputs = 5; repeated NodeDetails nodes = 6;
}
message NodeLogRequest { string execution_id = 1; string node_id = 2; int32 attempt_number = 3; }
message NodeLogsRequest {
    string execution_id = 1; string node_id = 2; int32 attempt_number = 3;
    int64 after_sequence = 4; int32 page_size = 5;
}
message NodeLogEntry {
    int64 sequence = 1; int64 timestamp = 2; string level = 3; string stream = 4;
    string message = 5; map<string,string> fields = 6;
}
message NodeLogsResponse { repeated NodeLogEntry entries = 1; int64 next_sequence = 2; bool has_more = 3; bool truncated = 4; }
message NodeLogChunk { bytes data = 1; int64 sequence = 2; bool is_last = 3; string filename = 4; bool truncated = 5; }
