syntax = "proto3";
package worker.v1;

// One instance per Docker host. Only the trusted orchestrator may control it.
service WorkerService {
    rpc Identity(Empty) returns (WorkerIdentity);
    rpc Create(ContainerAssignment) returns (ContainerIdentity);
    rpc Start(ContainerIdentity) returns (Empty);
    rpc Remove(ContainerIdentity) returns (Empty);
    rpc Reconcile(AttemptIdentity) returns (ReconcileResult);
}
message Empty {}
message WorkerIdentity { string daemon_id = 1; }
message ContainerIdentity { string container_id = 1; }
message AttemptIdentity {
    string execution_id = 1;
    string node_id = 2;
    int64 fence = 3;
    string attempt_id = 4;
    string role = 5;
}
message ContainerAssignment {
    AttemptIdentity attempt = 1;
    string image = 2;
    map<string, string> environment = 3;
    string network = 4;
    repeated string network_aliases = 5;
}
message ReconcileResult { bool removed = 1; }
