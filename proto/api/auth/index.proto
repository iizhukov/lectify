syntax = "proto3";
package auth.v1;

service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Refresh(TokenRequest) returns (AuthResponse);
  rpc Logout(TokenRequest) returns (OperationResponse);
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (OperationResponse);
  rpc RequestPasswordReset(PasswordResetRequest) returns (OperationResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (OperationResponse);
}
message Principal { string user_id = 1; string username = 2; bool is_admin = 3; }
message RegisterRequest { string username = 1; string email = 2; string password = 3; string full_name = 4; }
message LoginRequest { string username = 1; string password = 2; }
// Refresh requires a refresh token. Authenticate and ChangePassword use access tokens.
// Logout accepts either token and revokes the associated session.
message TokenRequest { string token = 1; }
message AuthResponse {
  Principal principal = 1;
  string access_token = 2;
  string refresh_token = 3;
  int64 access_expires_at = 4;
  int64 refresh_expires_at = 5;
}
message ChangePasswordRequest { string access_token = 1; string current_password = 2; string new_password = 3; }
message PasswordResetRequest { string email = 1; }
message ResetPasswordRequest { string token = 1; string new_password = 2; }
// accepted does not claim email delivery; delivery is a separate configured adapter.
message OperationResponse { bool accepted = 1; }

message AuthenticateRequest { string access_token = 1; }
message AuthenticateResponse { string user_id = 1; bool is_admin = 2; bool valid = 3; string username = 4; }
