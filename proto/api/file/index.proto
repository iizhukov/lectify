syntax = "proto3";
package api.file.v1;
service FileService {
  rpc Upload(stream UploadFrame) returns (File);
  rpc GetFile(FileRequest) returns (File);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc Download(FileRequest) returns (stream DownloadFrame);
  rpc DeleteFile(FileRequest) returns (DeleteFileResponse);
}
message UploadMetadata { string filename = 1; string content_type = 2; int64 size_bytes = 3; string sha256 = 4; }
message UploadFrame { oneof data { UploadMetadata metadata = 1; bytes chunk = 2; } int64 sequence = 3; bool is_last = 4; }
message File { string id = 1; string filename = 2; string content_type = 3; int64 size_bytes = 4; string sha256 = 5; string created_at = 6; }
message FileRequest { string id = 1; }
message ListFilesRequest { int32 page_size = 1; int32 offset = 2; }
message ListFilesResponse { repeated File files = 1; bool has_more = 2; }
message DownloadFrame { oneof data { File metadata = 1; bytes chunk = 2; } int64 sequence = 3; bool is_last = 4; }
message DeleteFileResponse { bool deleted = 1; }
