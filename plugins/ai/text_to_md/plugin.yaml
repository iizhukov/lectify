plugin:
  name: text_to_md
  version: 1.0.0
  description: Создание Markdown-конспекта через LLM с промптом из библиотеки
  category: ai
  inputs:
    - name: text
      type: stream/text
      buffer: {strategy: full}
    - name: prompt
      type: stream/prompt
      required: false
      buffer: {strategy: full}
  outputs:
    - {name: md_stream, type: stream/text}
    - {name: output, type: artifact/file}
    - {name: metadata, type: stream/json}
  parameters:
    - {name: max_chars, type: int, default: 40000}
    - {name: style, type: string, default: detailed}
    - {name: model, type: string, default: openai/gpt-4o-mini}
    - {name: temperature, type: float, default: 0.7}
    - {name: max_tokens, type: int, default: 4096}
    - {name: timeout, type: int, default: 120}
    - {name: values, type: dict, default: {}}
  permissions:
    llm:
      enabled: true
      allowed_models: [openai/gpt-4o-mini, gpt-4o, deepseek-chat]
      allowed_purposes: [summary]
    storage: {enabled: true, upload_artifacts: true}
